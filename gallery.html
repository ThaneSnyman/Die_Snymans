<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thane &amp; Chanel · Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f9fc;--ink:#2e2328;--muted:#6f6168;--accent:#7b2d3b;--blue:#a9cbe3;--line:#d5e3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1417;--ink:#f1e8ec;--muted:#b7a6ad;--accent:#a9cbe3;--line:#3b2c32}}
:root[data-theme="dark"]{--bg:#1a1417;--ink:#f1e8ec;--muted:#b7a6ad;--accent:#a9cbe3;--line:#3b2c32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.6 Jost,system-ui,sans-serif}
header{position:relative;text-align:center;padding:56px 20px 30px;background:linear-gradient(160deg,#7b2d3b,#a9cbe3);color:#fff}
.k{letter-spacing:.35em;text-transform:uppercase;font-size:13px}
.back{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));color:#fff;text-decoration:none;font-size:14px;letter-spacing:.06em}
h1{font:400 clamp(40px,10vw,76px)/1.1 "Cormorant Garamond",Georgia,serif;margin:10px 0 4px}
#n{font:italic 21px "Cormorant Garamond",serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:8px;max-width:1300px;margin:0 auto}
.grid button{padding:0;border:0;background:var(--line);aspect-ratio:1;overflow:hidden;cursor:zoom-in;border-radius:6px}
.grid img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s,transform .3s}
.grid img.ok{opacity:1}
.grid button:hover img{transform:scale(1.05)}
#msg{text-align:center;color:var(--muted);padding:60px 20px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(15,8,11,.95);display:none;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 10px calc(56px + env(safe-area-inset-bottom,0px))}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button,#lb a{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;cursor:pointer;text-decoration:none;font:400 16px Jost,sans-serif}
#x{top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;font-size:22px}
#pv,#nx{top:50%;margin-top:-24px;width:48px;height:48px;font-size:26px}
#pv{left:10px}#nx{right:10px}
#ct{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;letter-spacing:.1em}
#sv{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:10px 22px}
</style>
</head>
<body>
<header><a class="back" href="save-the-date.html">← Back</a><div class="k">Sien meer van ons</div><h1 id="title"></h1><div id="n"></div></header>
<div class="grid" id="grid"></div>
<div id="msg">Loading photos…</div>

<div id="lb"><div id="ct"></div><button id="x" type="button" aria-label="Close">✕</button><button id="pv" type="button" aria-label="Previous">‹</button><img id="big" alt=""><button id="nx" type="button" aria-label="Next">›</button><a id="sv" download>⬇ Save photo</a></div>

<script>
// ===== EDIT THESE =====
var C={
 title:"Thane & Chanel",
 repo:"thanesnyman/Thane_Troue",   // your GitHub username/repository
 folders:["photos",""],            // looks in the "photos" folder first, then the main list
 newestFirst:false,                // true = last photo first
 manual:[]                         // backup list if needed, e.g. ["photos/a.jpg","photos/b.jpg"]
};
// ======================
var $=function(i){return document.getElementById(i)};
$("title").textContent=C.title;document.title=C.title+" · Photos";
var L=[],cur=0;
function isImg(n){return /\.(jpe?g|png|webp|gif|avif)$/i.test(n)}
function list(k){if(k>=C.folders.length)return Promise.resolve([]);var f=C.folders[k];
return fetch("https://api.github.com/repos/"+C.repo+"/contents/"+f).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(a){
var l=a.filter(function(x){return x.type==="file"&&isImg(x.name)}).map(function(x){return(f?f+"/":"")+x.name});return l.length?l:list(k+1)}).catch(function(){return list(k+1)})}
list(0).then(function(l){if(!l.length)l=C.manual.slice();
l.sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})});if(C.newestFirst)l.reverse();
L=l.map(encodeURI);
if(!L.length){$("msg").textContent="No photos yet. Upload some to the photos folder and refresh.";return}
$("msg").remove();$("n").textContent=L.length+(L.length===1?" photo":" photos");
L.forEach(function(u,n){var b=document.createElement("button"),im=new Image();im.loading="lazy";im.decoding="async";im.alt="Photo "+(n+1);
im.onload=function(){im.className="ok"};im.onerror=function(){b.style.display="none"};im.src=u;
b.appendChild(im);b.onclick=function(){open(n)};$("grid").appendChild(b)})});

function open(n){cur=(n+L.length)%L.length;$("big").src=L[cur];$("sv").href=L[cur];$("ct").textContent=(cur+1)+" / "+L.length;$("lb").classList.add("on");
var p=new Image();p.src=L[(cur+1)%L.length]}
function shut(){$("lb").classList.remove("on");$("big").src=""}
$("x").onclick=shut;$("pv").onclick=function(){open(cur-1)};$("nx").onclick=function(){open(cur+1)};
$("lb").onclick=function(e){if(e.target===this)shut()};
addEventListener("keydown",function(e){if(!$("lb").classList.contains("on"))return;if(e.key==="Escape")shut();else if(e.key==="ArrowRight")open(cur+1);else if(e.key==="ArrowLeft")open(cur-1)});
var x0=null;$("lb").addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
$("lb").addEventListener("touchend",function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>50)open(d<0?cur+1:cur-1)},{passive:true});
</script>
</body>
</html>
