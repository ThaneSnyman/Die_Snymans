<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the Date · Thane &amp; Chanel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#a9cbe3;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:300 17px/1.6 Jost,system-ui,sans-serif;color:#fff;background:#1a1417;overflow:hidden}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1);transition:opacity 1.6s ease,transform 10s linear;display:grid;place-items:center}
.slide.on{opacity:1;transform:scale(1.12)}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(60,15,25,.55),rgba(60,15,25,.3) 40%,rgba(60,15,25,.75))}
#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.fp{position:absolute;bottom:-50px;opacity:.75;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
.wrap{position:relative;z-index:3;height:100%;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(60px + env(safe-area-inset-bottom,0px));text-align:center}
.box{max-width:580px;padding:42px 30px;border:1px solid rgba(255,255,255,.6);background:rgba(123,45,59,.4);backdrop-filter:blur(5px);border-radius:10px;opacity:0;transform:translateY(40px) scale(.94);transition:opacity 1s .5s,transform 1s .5s}
.go .box{opacity:1;transform:none}
.k{letter-spacing:.4em;text-transform:uppercase;font-size:14px;color:var(--blue)}
h1{font:400 clamp(30px,9vw,60px)/1.1 "Cormorant Garamond",Georgia,serif;margin:12px 0;white-space:nowrap}
.ch{display:inline-block;opacity:0}
.go .ch{animation:pop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(50px) scale(.3) rotate(-14deg)}to{opacity:1;transform:none}}
.date{font:600 clamp(24px,5vw,34px) "Cormorant Garamond",serif;letter-spacing:.06em;border-top:1px solid var(--blue);border-bottom:1px solid var(--blue);display:inline-block;padding:8px 22px;margin:6px 0 12px;background:linear-gradient(90deg,#fff,var(--blue),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.sm{font-size:15px;letter-spacing:.16em;text-transform:uppercase}
.cdn{font:italic 24px "Cormorant Garamond",serif;margin:14px 0}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{background:#fff;color:#7b2d3b;border:0;text-decoration:none;padding:11px 22px;border-radius:999px;font:500 15px Jost,sans-serif;cursor:pointer;transition:transform .2s}
.btn:hover{transform:scale(1.08) rotate(-2deg)}
.wrap{transition:opacity .9s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(circle at 50% 40%,#9c3a4d,#3a1520 70%);cursor:pointer;transition:opacity 1s,transform 1.2s}
#intro.open{opacity:0;transform:scale(1.7);pointer-events:none}
.env{position:relative;width:min(78vw,360px);height:min(52vw,240px);background:#dcebf5;border-radius:8px;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}
.env::before{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(to bottom right,transparent 49.5%,#c4dcec 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,#b3d1e6 50%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--blue);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s}
.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:60%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c04e63,#7b2d3b 60%,#4a1622);color:#fff;font:600 21px "Cormorant Garamond",serif;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.45);animation:pulse 1.5s infinite;z-index:2}
@keyframes pulse{50%{transform:scale(1.14)}}
.open .seal{opacity:0;transition:opacity .3s}
.tap{letter-spacing:.3em;text-transform:uppercase;font-size:14px;color:var(--blue);text-align:center;animation:pulse 2s infinite}
@media (prefers-reduced-motion:reduce){.slide{transition:opacity 1s}.slide.on{transform:none}}
#gv{position:fixed;inset:0;z-index:65;background:#1a1417;overflow-y:auto;display:none;padding:calc(70px + env(safe-area-inset-top,0px)) 8px 40px;text-align:center}
#gv.on{display:block}
.gh{font:400 clamp(40px,10vw,72px)/1.1 "Cormorant Garamond",Georgia,serif;margin:0}
#gn{font:italic 21px "Cormorant Garamond",serif;color:var(--blue);margin:4px 0 22px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-width:1200px;margin:0 auto}
.gg button{padding:0;border:0;aspect-ratio:1;background:#2c2024;overflow:hidden;border-radius:6px;cursor:zoom-in}
.gg img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.gg img.ok{opacity:1}
.rd{position:fixed;z-index:69;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;cursor:pointer;text-decoration:none;font:400 16px Jost,sans-serif}
#gx{top:calc(12px + env(safe-area-inset-top,0px));left:14px;padding:11px 20px;z-index:66}
#lb{position:fixed;inset:0;z-index:68;background:rgba(15,8,11,.96);display:none;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 10px calc(60px + env(safe-area-inset-bottom,0px))}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lbx{top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;font-size:22px}
#lbp,#lbn{top:50%;margin-top:-24px;width:48px;height:48px;font-size:26px}
#lbp{left:10px}#lbn{right:10px}
#lbc{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:14px;letter-spacing:.1em}
#lbs{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:10px 22px}
#ask{position:fixed;inset:0;z-index:70;background:rgba(26,20,23,.75);display:flex;align-items:center;justify-content:center;padding:24px}
#ask[hidden]{display:none}
.dlg{background:#fff;color:#2e2328;max-width:420px;width:100%;border-radius:16px;padding:30px;text-align:center}
.dlg .em{font-size:46px}
.dlg h2{font:600 32px "Cormorant Garamond",serif;margin:4px 0 8px}
.dlg p{margin:0 0 18px;color:#6f6168}
.dlg .btn{background:#7b2d3b;color:#fff;margin:4px}
.dlg .btn.alt{background:#a9cbe3;color:#2e2328}
.dlg input,.dlg textarea{width:100%;padding:12px;margin:0 0 10px;border:1px solid #d5e3ee;border-radius:10px;font:inherit;color:#2e2328;background:#fff}
.dlg .err{color:#a02a3b;font-size:14px;min-height:20px;margin-bottom:6px}
</style>
</head>
<body>
<div id="slides"></div><div class="shade"></div>
<main class="wrap"><div class="box">
<div class="k">Save the Date</div>
<h1 id="names"></h1>
<div class="date" id="date"></div>
<div class="sm" id="venue"></div>
<div class="cdn" id="cdn"></div>
<div class="btns"><a class="btn" id="more2" href="gallery.html">📷 Sien meer van ons</a><a class="btn" id="cal" target="_blank" rel="noopener" href="#">📅 Voeg by kalender</a><button class="btn" id="nope" type="button">😢 Kan nie kom nie</button></div>
<p style="margin:14px 0 0;font:italic 20px 'Cormorant Garamond',serif">Formele uitnodiging sal volg</p>
</div></main>
<div id="ask" hidden><div class="dlg"><h2 style="margin-bottom:20px">Is jy 100% seker?</h2><button class="btn" id="yes" type="button">Ja, ek is 100% seker</button><button class="btn alt" id="no" type="button">Eintlik, ek sal daar wees! 🎉</button></div></div>
<div id="intro"><div class="env"><div class="flap"></div><div class="seal">T&amp;C</div></div><div class="tap">💌 Maak oop die seël</div></div>
<div id="gv"><button class="rd" id="gx" type="button">← Terug</button><h2 class="gh">Sien meer van ons</h2><div id="gn"></div><div class="gg" id="gg"></div></div>
<div id="lb"><div id="lbc"></div><button class="rd" id="lbx" type="button" aria-label="Maak toe">✕</button><button class="rd" id="lbp" type="button" aria-label="Vorige">‹</button><img id="lbi" alt=""><button class="rd" id="lbn" type="button" aria-label="Volgende">›</button><a class="rd" id="lbs" download>⬇ Stoor foto</a></div>
<canvas id="fx"></canvas>

<script>
// ===== EDIT THESE =====
var C={names:"Thane & Chanel",dateText:"9 Oktober 2027",venue:"Cradle Valley",email:"you@example.com",target:"2027-10-09T15:00:00",
cal:"https://calendar.google.com/calendar/render?action=TEMPLATE&text=Thane+%26+Chanel+se+Troue&dates=20271009T150000/20271010T000000&ctz=Africa/Johannesburg&location=Cradle+Valley%2C+12+R374%2C+Zwartkop%2C+Muldersdrift%2C+1739"};
// Put your photos in a folder called "photos" next to this file, then list them here.
var REPO="thanesnyman/Thane_Troue";   // your GitHub username/repository
var FOLDERS=["photos",""];            // photos are found automatically: "photos" folder first, then the main list
var GALLERY="gallery.html";           // the "Sien meer van ons" photo page
var HERO_MAX=12;                      // most photos used in the slideshow
var SECONDS=5;                        // seconds per photo
var SHEET_URL="https://script.google.com/macros/s/AKfycbwn7soXdcJUKqZ7ie7OEBxxGI6xG1j-g3hiD1emy9pBSZ22J4ZrbgaJPf3i6wJBZbo-Fg/exec";                     // paste your Google Apps Script web app URL here (saves the NO replies to your spreadsheet)
var MANUAL=[];                        // backup list if needed, e.g. ["photos/a.jpg","photos/b.jpg"]
// ======================
var $=function(i){return document.getElementById(i)};
document.title="Save the Date · "+C.names;
$("date").textContent=C.dateText;$("venue").textContent=C.venue;$("cal").href=C.cal;$("more2").href=GALLERY;
C.names.split("").forEach(function(ch,k){var s=document.createElement("span");s.className="ch";s.textContent=ch==" "?"\u00a0":ch;s.style.animationDelay=(k*.07+.7)+"s";$("names").appendChild(s)});
var days=Math.ceil((new Date(C.target)-new Date())/864e5);
$("cdn").textContent=days>1?"Nog "+days+" slapies oor ✨":days===1?"Môre! 🎊":days===0?"Vandag is die dag! 💍":"Ons is getroud! 🥂";

// confetti
var cv=$("fx"),cx=cv.getContext("2d"),P=[],W,H,COL=["#7b2d3b","#a9cbe3","#ffffff","#e8b4bf","#5d8fb3","#f5d9a8"];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
function burst(x,y,n){for(var k=0;k<n;k++){var a=Math.random()*6.283,s=4+Math.random()*9;P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:3+Math.random()*4,c:COL[k%COL.length],l:120+Math.random()*60})}}
(function loop(){cx.clearRect(0,0,W,H);for(var k=P.length-1;k>=0;k--){var p=P[k];p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.99;p.r+=p.vr;p.l--;if(p.l<0||p.y>H+20){P.splice(k,1);continue}cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}requestAnimationFrame(loop)})();


// envelope
$("intro").onclick=function(){var i=this;if(i.classList.contains("open"))return;i.classList.add("open");document.body.classList.add("go");
setTimeout(function(){burst(W*.5,H*.45,170);burst(W*.2,H*.6,80);burst(W*.8,H*.6,80)},700);
setTimeout(function(){i.remove()},1900)};
var ask=$("ask"),dlg=ask.querySelector(".dlg"),dlg0=dlg.innerHTML;
function shut(){ask.hidden=true;dlg.innerHTML=dlg0;bindAsk()}
function bindAsk(){
$("yes").onclick=function(){
dlg.innerHTML='<div class="em"></div><h2>Wie gaan ons mis?</h2><p></p><input id="fn" type="text" placeholder="Jou naam" autocomplete="name"><textarea id="fm" rows="2" placeholder="\'n Boodskap vir ons (opsioneel)"></textarea><div class="err" id="fe"></div><button class="btn" id="fs" type="button">Stuur</button><button class="btn alt" id="fb" type="button">Terug</button>';
$("fb").onclick=shut;
$("fs").onclick=function(){var n=$("fn").value.trim(),m=$("fm").value.trim();
if(!n){$("fe").textContent="Voer asseblief jou naam in.";return}
$("fs").disabled=true;$("fs").textContent="Stuur tans…";
var done=function(){dlg.innerHTML='<div class="em">💙</div><h2 style="margin-bottom:20px">Ons sal jou mis</h2><button class="btn" id="cl" type="button">Maak toe</button>';$("cl").onclick=shut};
if(SHEET_URL){fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:new URLSearchParams({name:n,message:m,response:"Kan nie kom nie"})}).then(done,function(){$("fe").textContent="Kon nie stuur nie. Kyk asseblief jou verbinding en probeer weer.";$("fs").disabled=false;$("fs").textContent="Stuur"})}
else{done();setTimeout(function(){location.href="mailto:"+C.email+"?subject="+encodeURIComponent("Jammer, ek kan nie kom nie")+"&body="+encodeURIComponent("Hallo "+C.names+", dit is "+n+". Ek is baie jammer, maar ek sal nie op "+C.dateText+" by julle kan wees nie. "+m)},500)}}};
$("no").onclick=function(){shut();burst(W*.5,H*.5,200);burst(W*.2,H*.6,90);burst(W*.8,H*.6,90)}}
bindAsk();
$("nope").onclick=function(){ask.hidden=false};
document.addEventListener("pointerdown",function(e){if(document.body.classList.contains("go")&&!e.target.closest("a,button,#ask,#gv,#lb"))burst(e.clientX,e.clientY,40)});

// slideshow
var els=[],i=0,timer;
function show(n){i=n;[n,(n+1)%els.length].forEach(function(k){var d=els[k];if(d.dataset.u&&!d.style.backgroundImage)d.style.backgroundImage="url('"+d.dataset.u+"')"});
els.forEach(function(e,k){e.classList.toggle("on",k===n)})}
function restart(){clearTimeout(timer);if(els.length>1)timer=setTimeout(function(){show((i+1)%els.length);restart()},SECONDS*1000)}
function build(list,img){list.forEach(function(s,n){var d=document.createElement("div");d.className="slide";if(img)d.dataset.u=s;else d.style.background=s;$("slides").appendChild(d);els.push(d);});show(0);restart()}

// photos from GitHub: found automatically
function isImg(n){return /\.(jpe?g|png|webp|gif|avif)$/i.test(n)}
function list(k){if(k>=FOLDERS.length)return Promise.resolve([]);var f=FOLDERS[k];
return fetch("https://api.github.com/repos/"+REPO+"/contents/"+f).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(a){
var l=a.filter(function(x){return x.type==="file"&&isImg(x.name)}).map(function(x){return(f?f+"/":"")+x.name});return l.length?l:list(k+1)}).catch(function(){return list(k+1)})}
function pickN(arr,k){if(arr.length<=k)return arr.slice();var o=[];for(var j=0;j<k;j++)o.push(arr[Math.floor(j*arr.length/k)]);return o}
list(0).then(function(l){if(!l.length)l=MANUAL.slice();
l.sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})});
var ALL=l.map(encodeURI);GALL=ALL;
var pics=pickN(ALL,HERO_MAX);
pics.length?build(pics,true):build(["linear-gradient(160deg,#7b2d3b,#3a1520)","linear-gradient(160deg,#a9cbe3,#5d8fb3)","linear-gradient(160deg,#5c2230,#a9cbe3)"],false)});

// built-in photo browser ("Sien meer van ons")
var GALL=[],gcur=0,gbuilt=false;
function openGal(){$("gv").classList.add("on");
if(gbuilt)return;gbuilt=true;
if(!GALL.length){$("gn").textContent="Foto's kom binnekort.";return}
GALL.forEach(function(u,n){var b=document.createElement("button"),im=new Image();im.loading="lazy";im.decoding="async";im.alt="Foto "+(n+1);
im.onload=function(){im.className="ok"};im.onerror=function(){b.style.display="none"};im.src=u;b.appendChild(im);b.onclick=function(){lbOpen(n)};$("gg").appendChild(b)})}
function lbOpen(n){gcur=(n+GALL.length)%GALL.length;$("lbi").src=GALL[gcur];$("lbs").href=GALL[gcur];$("lbc").textContent=(gcur+1)+" / "+GALL.length;$("lb").classList.add("on");var p=new Image();p.src=GALL[(gcur+1)%GALL.length]}
function lbShut(){$("lb").classList.remove("on");$("lbi").src=""}
$("more2").onclick=function(e){e.preventDefault();openGal()};
$("gx").onclick=function(){$("gv").classList.remove("on")};
$("lbx").onclick=lbShut;$("lbp").onclick=function(){lbOpen(gcur-1)};$("lbn").onclick=function(){lbOpen(gcur+1)};
$("lb").onclick=function(e){if(e.target===this)lbShut()};
addEventListener("keydown",function(e){if($("lb").classList.contains("on")){if(e.key==="Escape")lbShut();else if(e.key==="ArrowRight")lbOpen(gcur+1);else if(e.key==="ArrowLeft")lbOpen(gcur-1)}else if(e.key==="Escape")$("gv").classList.remove("on")});
var lx=null;$("lb").addEventListener("touchstart",function(e){lx=e.touches[0].clientX},{passive:true});
$("lb").addEventListener("touchend",function(e){if(lx===null)return;var d=e.changedTouches[0].clientX-lx;lx=null;if(Math.abs(d)>50)lbOpen(d<0?gcur+1:gcur-1)},{passive:true});
</script>
</body>
</html>
